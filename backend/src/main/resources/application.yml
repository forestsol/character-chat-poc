spring:
  application:
    name: character-chat
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/character_chat}
    username: ${DB_USERNAME:character_chat}
    password: ${DB_PASSWORD:character_chat}
  flyway:
    enabled: true

server:
  port: ${APP_PORT:8081}

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

book-input:
  root-directory: ${BOOK_INPUT_ROOT:../test-books}

ai:
  provider: ${AI_PROVIDER:fake}
  entity-extraction:
    batch-size: ${AI_ENTITY_BATCH_SIZE:20}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6-luna}
    timeout: ${OPENAI_TIMEOUT:60s}
    max-retries: ${OPENAI_MAX_RETRIES:2}
