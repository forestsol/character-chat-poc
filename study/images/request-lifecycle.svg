<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">API 요청 생명주기</title><desc id="desc">브라우저 요청이 Controller, Service, Mapper, DB를 거쳐 응답되는 과정</desc><defs><style>.t{font-family:'Segoe UI','Noto Sans KR',sans-serif;fill:#192437}.h{font-size:24px;font-weight:700}.m{font-size:17px;font-weight:700}.s{font-size:13px}.b{stroke-width:2;rx:16}.a{stroke:#66758a;stroke-width:3;fill:none;marker-end:url(#x)}</style><marker id="x" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#66758a"/></marker></defs><rect width="1200" height="430" rx="24" fill="#f5f7fa"/><text x="50" y="55" class="t h">한 번의 API 요청은 어디를 지날까?</text>
<g><rect x="45" y="125" width="170" height="120" class="b" fill="#e4f0ff" stroke="#4f87c7"/><text x="130" y="168" text-anchor="middle" class="t m">브라우저</text><text x="130" y="198" text-anchor="middle" class="t s">fetch + JSON</text><text x="130" y="220" text-anchor="middle" class="t s">로딩/오류 상태</text>
<rect x="280" y="125" width="175" height="120" class="b" fill="#e9f7ed" stroke="#4a9964"/><text x="367" y="168" text-anchor="middle" class="t m">Controller</text><text x="367" y="198" text-anchor="middle" class="t s">URL · 입력 검증</text><text x="367" y="220" text-anchor="middle" class="t s">HTTP ↔ DTO</text>
<rect x="520" y="125" width="175" height="120" class="b" fill="#fff7d9" stroke="#b69b35"/><text x="607" y="168" text-anchor="middle" class="t m">Service</text><text x="607" y="198" text-anchor="middle" class="t s">업무 규칙 · 순서</text><text x="607" y="220" text-anchor="middle" class="t s">트랜잭션 경계</text>
<rect x="760" y="125" width="175" height="120" class="b" fill="#f5eaff" stroke="#8b69b3"/><text x="847" y="168" text-anchor="middle" class="t m">Mapper</text><text x="847" y="198" text-anchor="middle" class="t s">메서드 ↔ SQL</text><text x="847" y="220" text-anchor="middle" class="t s">파라미터 바인딩</text>
<rect x="1000" y="125" width="155" height="120" class="b" fill="#ffece4" stroke="#cc7047"/><text x="1077" y="168" text-anchor="middle" class="t m">DB / AI</text><text x="1077" y="198" text-anchor="middle" class="t s">저장·검색</text><text x="1077" y="220" text-anchor="middle" class="t s">외부 추론</text></g>
<path d="M215 175H272" class="a"/><path d="M455 175H512" class="a"/><path d="M695 175H752" class="a"/><path d="M935 175H992" class="a"/><path d="M1000 225H943" class="a"/><path d="M760 225H703" class="a"/><path d="M520 225H463" class="a"/><path d="M280 225H223" class="a"/>
<text x="600" y="310" text-anchor="middle" class="t m">오류 경로</text><text x="600" y="340" text-anchor="middle" class="t s">도메인 예외 → GlobalExceptionHandler → 일관된 HTTP 상태 + ApiErrorResponse → 화면 오류 메시지</text><text x="600" y="382" text-anchor="middle" class="t s">진단 원칙: 왼쪽부터 “어디까지 정상인가?”를 확인해 실패 경계를 좁힌다.</text></svg>
