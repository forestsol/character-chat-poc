<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Character Chat 전체 시스템 구조</title><desc id="desc">사용자, Next.js, Spring Boot, PostgreSQL, OpenAI, Gradio 사이의 연결</desc>
  <defs><style>.t{font-family:'Segoe UI','Noto Sans KR',sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.m{font-size:17px;font-weight:700}.s{font-size:14px}.box{stroke-width:2;rx:18}.arrow{stroke:#53657d;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:8 7}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53657d"/></marker></defs>
  <rect width="1200" height="650" rx="26" fill="#f7f4eb"/><text x="55" y="58" class="t h">Character Chat PoC — 전체 시스템 지도</text>
