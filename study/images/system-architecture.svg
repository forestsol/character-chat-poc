  <rect x="650" y="85" width="270" height="190" class="box" fill="#e8f6ed" stroke="#4b9a68"/><text x="785" y="128" text-anchor="middle" class="t m">Spring Boot API</text><text x="785" y="160" text-anchor="middle" class="t s">Controller → Service</text><text x="785" y="188" text-anchor="middle" class="t s">MyBatis · Flyway · Actuator</text><text x="785" y="216" text-anchor="middle" class="t s">Fake/OpenAI 교체 경계</text><text x="785" y="244" text-anchor="middle" class="t s">localhost:8081</text>
