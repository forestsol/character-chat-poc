<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">책 분석 파이프라인</title><desc id="desc">책 가져오기부터 캐릭터 프로필, RAG, 채팅까지의 단계</desc><defs><style>.t{font-family:'Segoe UI','Noto Sans KR',sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.m{font-size:15px;font-weight:700}.s{font-size:12px}.b{stroke-width:2;rx:14}.a{stroke:#65758b;stroke-width:3;fill:none;marker-end:url(#x)}</style><marker id="x" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#65758b"/></marker></defs><rect width="1200" height="650" rx="24" fill="#faf8f1"/><text x="48" y="54" class="t h">책 한 권이 대화 가능한 캐릭터가 되기까지</text>
<g text-anchor="middle"><rect x="45" y="105" width="170" height="95" class="b" fill="#e7f1ff" stroke="#5287c2"/><text x="130" y="142" class="t m">① 원문 입력</text><text x="130" y="169" class="t s">페이지 · 문단 · 이미지</text>
<rect x="270" y="105" width="170" height="95" class="b" fill="#eaf7ee" stroke="#50956a"/><text x="355" y="142" class="t m">② 개체 후보</text><text x="355" y="169" class="t s">인물 · 장소 · 사물</text>
<rect x="495" y="105" width="170" height="95" class="b" fill="#f1eaff" stroke="#896cb0"/><text x="580" y="142" class="t m">③ 이미지 분석</text><text x="580" y="169" class="t s">행동 · 표정 · 배경</text>
<rect x="720" y="105" width="170" height="95" class="b" fill="#fff4d8" stroke="#b79435"/><text x="805" y="142" class="t m">④ KG 구성</text><text x="805" y="169" class="t s">사건 · 참여자 · 관계</text>
<rect x="945" y="105" width="205" height="95" class="b" fill="#ffece3" stroke="#c8734d"/><text x="1047" y="142" class="t m">⑤ 사람 검토</text><text x="1047" y="169" class="t s">승인 · 거절 · 병합 · 역할</text></g>
<path d="M215 152H262" class="a"/><path d="M440 152H487" class="a"/><path d="M665 152H712" class="a"/><path d="M890 152H937" class="a"/>
<g text-anchor="middle"><rect x="945" y="330" width="205" height="100" class="b" fill="#e8f5ff" stroke="#4f8db5"/><text x="1047" y="370" class="t m">⑥ 프로필 생성</text><text x="1047" y="397" class="t s">성격 · 말투 · 근거</text>
<rect x="610" y="330" width="220" height="100" class="b" fill="#edf7e9" stroke="#62954e"/><text x="720" y="370" class="t m">⑦ RAG 색인</text><text x="720" y="397" class="t s">문단 → 임베딩 벡터</text>
<rect x="275" y="330" width="220" height="100" class="b" fill="#fff0e9" stroke="#c8704e"/><text x="385" y="370" class="t m">⑧ 근거 검색</text><text x="385" y="397" class="t s">top K + 앞뒤 문맥</text>
<rect x="45" y="330" width="170" height="100" class="b" fill="#f2eaff" stroke="#8065a7"/><text x="130" y="370" class="t m">⑨ 캐릭터 답변</text><text x="130" y="397" class="t s">프로필 + RAG + KG</text></g>
<path d="M1047 200V322" class="a"/><path d="M945 380H838" class="a"/><path d="M610 380H503" class="a"/><path d="M275 380H223" class="a"/>
<rect x="275" y="505" width="650" height="85" rx="16" fill="#fff" stroke="#8c99a8" stroke-width="2"/><text x="600" y="538" text-anchor="middle" class="t m">모든 단계의 공통 원칙</text><text x="600" y="566" text-anchor="middle" class="t s">원문 ID로 근거 추적 · AI 결과 서버 검증 · 상태 저장 · 실패 단계 분리 · 재실행 가능한 파이프라인</text>
<path d="M130 438V548H267" class="a"/><text x="48" y="625" class="t s">PoC에서는 각 단계를 Gradio QA에서 따로 실행하여 중간 결과를 사람이 확인할 수 있다.</text></svg>
