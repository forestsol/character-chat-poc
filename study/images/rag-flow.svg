<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">RAG 색인과 검색 흐름</title><desc id="desc">문단 임베딩 색인과 질문 검색 후 근거 기반 답변 생성 흐름</desc><defs><style>.t{font-family:'Segoe UI','Noto Sans KR',sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.m{font-size:16px;font-weight:700}.s{font-size:13px}.b{stroke-width:2;rx:15}.a{stroke:#617188;stroke-width:3;fill:none;marker-end:url(#x)}</style><marker id="x" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#617188"/></marker></defs><rect width="1200" height="620" rx="24" fill="#f7f8fb"/><text x="48" y="54" class="t h">RAG = 미리 색인하기 + 질문할 때 검색하기</text><text x="70" y="105" class="t m">A. 색인(Indexing) — 책마다 미리 수행</text>
<rect x="70" y="135" width="200" height="95" class="b" fill="#e7f1ff" stroke="#4e86c3"/><text x="170" y="173" text-anchor="middle" class="t m">책 문단</text><text x="170" y="201" text-anchor="middle" class="t s">sourceOrder + 원문</text><rect x="355" y="135" width="200" height="95" class="b" fill="#f0eaff" stroke="#8668af"/><text x="455" y="173" text-anchor="middle" class="t m">Embedding API</text><text x="455" y="201" text-anchor="middle" class="t s">의미 → 1536개 숫자</text><rect x="640" y="135" width="235" height="95" class="b" fill="#ffece3" stroke="#c7754e"/><text x="757" y="173" text-anchor="middle" class="t m">rag_document</text><text x="757" y="201" text-anchor="middle" class="t s">원문 + vector + 모델 버전</text><path d="M270 182H347" class="a"/><path d="M555 182H632" class="a"/>
<text x="70" y="305" class="t m">B. 검색·생성(Retrieval + Generation) — 질문마다 수행</text><rect x="70" y="335" width="160" height="90" class="b" fill="#fff5d9" stroke="#b79a36"/><text x="150" y="371" text-anchor="middle" class="t m">사용자 질문</text><text x="150" y="399" text-anchor="middle" class="t s">“왜 따라갔어?”</text><rect x="300" y="335" width="160" height="90" class="b" fill="#f0eaff" stroke="#8668af"/><text x="380" y="371" text-anchor="middle" class="t m">질문 임베딩</text><text x="380" y="399" text-anchor="middle" class="t s">같은 모델·차원</text><rect x="530" y="335" width="175" height="90" class="b" fill="#ffece3" stroke="#c7754e"/><text x="617" y="371" text-anchor="middle" class="t m">벡터 검색</text><text x="617" y="399" text-anchor="middle" class="t s">코사인 거리 top K</text><rect x="775" y="335" width="175" height="90" class="b" fill="#eaf7ed" stroke="#51936a"/><text x="862" y="371" text-anchor="middle" class="t m">문맥 확장</text><text x="862" y="399" text-anchor="middle" class="t s">앞뒤 N · 범위 병합</text><rect x="1020" y="335" width="135" height="90" class="b" fill="#e7f1ff" stroke="#4e86c3"/><text x="1087" y="371" text-anchor="middle" class="t m">답변</text><text x="1087" y="399" text-anchor="middle" class="t s">근거 ID 포함</text><path d="M230 380H292" class="a"/><path d="M460 380H522" class="a"/><path d="M705 380H767" class="a"/><path d="M950 380H1012" class="a"/>
<rect x="180" y="490" width="840" height="78" rx="15" fill="#fff" stroke="#8997a8" stroke-width="2"/><text x="600" y="520" text-anchor="middle" class="t m">LLM에 전달되는 최종 문맥</text><text x="600" y="547" text-anchor="middle" class="t s">캐릭터 프로필 + 검색 문단 + 직접 KG 관계 + 대화 이력 + 답변 규칙</text><path d="M1087 430V470Q1087 480 1067 480H600V482" class="a"/></svg>
